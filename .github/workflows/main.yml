name: CI/CD

on:
  push:
  pull_request:

env:
  PROJECT_NAME: odh-imageresizer-core
  DOCKER_IMAGE: ghcr.io/${{ github.repository }}/${{ github.event.repository.name }}
  DOCKER_TAG: ${{ github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Setup .NET
      uses: actions/setup-dotnet@v1
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore odh-imageresizer-core.sln
    - name: Build
      run: dotnet build odh-imageresizer-core.sln --no-restore
    - name: Test
      run: dotnet test odh-imageresizer-core.sln --no-build --verbosity normal

  # Deploy Test (Kubernetes / EKS)
  deploy-test:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    needs: test
    environment: test
    concurrency: deploy-test
    steps:
      - name: Checkout source code
        uses: actions/checkout@v2

      - name: Build and push
        uses: noi-techpark/github-actions/docker-build-and-push@v2
        with:
          docker-username: ${{ github.actor }}
          docker-password: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ./
          docker-compose-file: docker-compose.yml

      - name: Customize test.yaml
        run: |
          yq -i '.image.repository="${{ env.DOCKER_IMAGE }}"' infrastructure/helm/test.yaml
          yq -i '.image.tag="${{ env.DOCKER_TAG }}"' infrastructure/helm/test.yaml
          yq -i '.image.pullPolicy="IfNotPresent"' infrastructure/helm/test.yaml

          yq -i '.envSecret.ASPNETCORE_S3BucketUrl="${{ secrets.ODH_IMAGERESIZERCORE_S3 }}"' infrastructure/helm/test.yaml

      - name: Deploy on cluster
        uses: noi-techpark/github-actions/helm-deploy@v3
        with:
          k8s-name: imageresizer
          k8s-namespace: core
          chart-path: infrastructure/helm/imageresizer
          values-file: infrastructure/helm/test.yaml
          aws-access-key-id: ${{ secrets[vars.AWS_KEY_ID] }}
          aws-secret-access-key: ${{ secrets[vars.AWS_KEY_SECRET] }}
          aws-eks-cluster-name: aws-main-eu-01
          aws-region: eu-west-1

  # Deploy Prod (Kubernetes / EKS)
  deploy-prod:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/prod'
    needs: test
    environment: prod
    concurrency: deploy-prod
    steps:
      - name: Checkout source code
        uses: actions/checkout@v2

      - name: Build and push
        uses: noi-techpark/github-actions/docker-build-and-push@v2
        with:
          docker-username: ${{ github.actor }}
          docker-password: ${{ secrets.GITHUB_TOKEN }}
          working-directory: ./
          docker-compose-file: docker-compose.yml

      - name: Customize prod.yaml
        run: |
          yq -i '.image.repository="${{ env.DOCKER_IMAGE }}"' infrastructure/helm/prod.yaml
          yq -i '.image.tag="${{ env.DOCKER_TAG }}"' infrastructure/helm/prod.yaml
          yq -i '.image.pullPolicy="IfNotPresent"' infrastructure/helm/prod.yaml

          yq -i '.envSecret.ASPNETCORE_S3BucketUrl="${{ secrets.ODH_IMAGERESIZERCORE_S3 }}"' infrastructure/helm/prod.yaml

      - name: Deploy on cluster
        uses: noi-techpark/github-actions/helm-deploy@v3
        with:
          k8s-name: imageresizer
          k8s-namespace: core
          chart-path: infrastructure/helm/imageresizer
          values-file: infrastructure/helm/prod.yaml
          aws-access-key-id: ${{ secrets[vars.AWS_KEY_ID] }}
          aws-secret-access-key: ${{ secrets[vars.AWS_KEY_SECRET] }}
          aws-eks-cluster-name: aws-main-eu-01
          aws-region: eu-west-1
