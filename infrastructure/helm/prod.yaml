# Prod environment values for the imageresizer chart.
#
# Non-secret configuration lives here (committed). Sensitive values are listed under
# `envSecret` with empty placeholders and are filled in at deploy time by the GitHub
# Actions workflow (yq) from repository secrets, then rendered into a K8s Secret.
#
# image.repository / image.tag / image.pullPolicy are also overwritten by the workflow.

image:
  repository: ghcr.io/noi-techpark/opendatahub-imageresizer/opendatahub-imageresizer
  pullPolicy: IfNotPresent
  tag: "latest"

# The GHCR package is private; this pull secret must exist in the prod cluster's `core` namespace.
imagePullSecrets:
  - name: container-registry-r

replicaCount: 1

# Memory request == limit so the pod is protected from node-pressure eviction
# (usage can never exceed the request); it is OOM-killed only if it exceeds the limit.
# Tune to actual usage — raise the limit if you observe OOMKills under load.
resources:
  requests:
    cpu: 100m
    memory: 2Gi
  limits:
    memory: 2Gi

service:
  type: ClusterIP
  port: 80
  targetport: http
  containerport: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    # Extra hostnames served by the same nginx server block as the primary hosts below.
    nginx.ingress.kubernetes.io/server-alias: "tourism.images.opendatahub.com, images.opendatahub.bz.it, tourism.images.opendatahub.bz.it"
  hosts:
    - host: images.opendatahub.com
      paths:
        - path: "/"
          pathType: Prefix
    - host: cdn.opendatahub.com
      paths:
        - path: "/"
          pathType: Prefix

# Non-secret environment (mirrors the docker prod deployment).
env:
  ASPNETCORE_URLS: "http://+:80"
  ASPNETCORE_ENVIRONMENT: "Production"

# Sensitive environment. Placeholders only — filled at deploy time by the workflow.
envSecret:
  ASPNETCORE_S3BucketUrl: ""
