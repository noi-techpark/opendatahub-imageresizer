# Test environment values for the imageresizer chart.
#
# Non-secret configuration lives here (committed). Sensitive values are listed under
# `envSecret` with empty placeholders and are filled in at deploy time by the GitHub
# Actions workflow (yq) from repository secrets, then rendered into a K8s Secret.
#
# image.repository / image.tag / image.pullPolicy are also overwritten by the workflow.

image:
  repository: ghcr.io/noi-techpark/opendatahub-imageresizer/opendatahub-imageresizer
  pullPolicy: IfNotPresent
  tag: "latest"

# The GHCR package is pulled with credentials today (Ansible docker login), so treat it
# as private. This secret already exists in the `core` namespace (see infra-v2 docs/secrets.md).
imagePullSecrets:
  - name: container-registry-r

replicaCount: 1

# Memory request == limit so the pod is protected from node-pressure eviction
# (usage can never exceed the request); it is OOM-killed only if it exceeds the limit.
# Tune to actual usage — raise the limit if you observe OOMKills under load.
resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 512Mi

service:
  type: ClusterIP
  port: 80
  targetport: http
  containerport: 80

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
  hosts:
    - host: images.tourism.testingmachine.eu
      paths:
        - path: "/"
          pathType: Prefix
    - host: cdn.opendatahub.testingmachine.eu
      paths:
        - path: "/"
          pathType: Prefix

# Non-secret environment (mirrors infrastructure/docker-compose.run.yml).
env:
  ASPNETCORE_URLS: "http://+:80"
  ASPNETCORE_ENVIRONMENT: "Development"

# Sensitive environment. Placeholders only — filled at deploy time by the workflow.
envSecret:
  ASPNETCORE_S3BucketUrl: ""
